
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', Arial, sans-serif;
    background: #f8f5f0;
    color: #292929;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    background: #ffffff;
    max-width: 850px;
    width: 100%;
    padding: 65px 35px;
    text-align: center;
    border-radius: 24px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.07);
    position: relative;
    overflow: hidden;
}

.top-line {
    width: 65px;
    height: 4px;
    background: #c69b62;
    margin: 0 auto 30px;
    border-radius: 10px;
}

.icon {
    width: 85px;
    height: 85px;
    background: #f4eadc;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
    font-size: 38px;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(36px, 6vw, 54px);
    font-weight: 500;
    margin-bottom: 18px;
    color: #292929;
}

.highlight {
    color: #b58a55;
}

.subtitle {
    font-size: 17px;
    line-height: 1.8;
    color: #777;
    max-width: 580px;
    margin: 0 auto 35px;
}

.message {
    background: #faf7f2;
    padding: 25px;
    border-radius: 15px;
    margin: 30px auto;
    max-width: 600px;
}

.message h2 {
    font-family: Georgia, serif;
    font-size: 25px;
    margin-bottom: 12px;
}

.message p {
    color: #777;
    line-height: 1.7;
    font-size: 15px;
}

.button {
    display: inline-block;
    text-decoration: none;
    background: #292929;
    color: white;
    padding: 15px 35px;
    border-radius: 40px;
    margin-top: 20px;
    transition: 0.3s ease;
    font-size: 15px;
}

.button:hover {
    background: #b58a55;
    transform: translateY(-3px);
}

.footer {
    margin-top: 45px;
    font-size: 13px;
    color: #999;
}

.decoration {
    position: absolute;
    width: 180px;
    height: 180px;
    background: #f8f1e8;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.6;
}

.circle-one {
    top: -110px;
    left: -80px;
}

.circle-two {
    bottom: -120px;
    right: -80px;
}

.content {
    position: relative;
    z-index: 1;
}

@media(max-width:600px) {
    .container {
        padding: 45px 22px;
    }

    .subtitle {
        font-size: 15px;
    }

    .message {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="decoration circle-one"></div>
    <div class="decoration circle-two"></div>

    <div class="content">

        <div class="top-line"></div>

        <div class="icon">✓</div>

        <h1>Thank <span class="highlight">You!</span></h1>

        <p class="subtitle">
            Your submission has been received successfully.
            We're so happy you're here and truly appreciate your trust.
        </p>

        <div class="message">
            <h2>What's Next?</h2>
            <p>
                We've received your details and will be in touch soon.
                Keep an eye on your inbox for the next update!
            </p>
        </div>

        <a href="/" class="button">
            Back to Home →
        </a>

        <div class="footer">
            Made with care. Thank you for being here!
        </div>

    </div>
</div>

</body>
</html>
